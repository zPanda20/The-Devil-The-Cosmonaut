<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Devil &amp; The Cosmonaut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* Home: title, unlock banner, daily mission, the two games, then the deck shelf. Colours and type come from the equipped deck. */
:root {
  --table: #0E0B0B;
  --surface: #1A1414;
  --line: #3A2C2C;
  --text: #F3EAE0;
  --muted: #B9A9A0;
  --accent: #D7261E;
  --accent-text: #F3EAE0;
  --warn: #E8B33A;
  --display: Impact, 'Arial Narrow', sans-serif;
  --ui: Impact, 'Arial Narrow', sans-serif;
  --body: system-ui, sans-serif;
  --display-size: clamp(42px, 7vw, 68px);
  --ui-size: 18px;
  --body-size: 14px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--table); color: var(--text); transition: background-color 200ms ease; }
body { margin: 0; font-family: var(--body); font-size: var(--body-size); }
.app {
  max-width: 1120px; margin: 0 auto;
  padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.kicker { margin: 0; color: var(--muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 400; font-size: calc(var(--display-size) * 1.15); line-height: 0.92; letter-spacing: 1px; margin: 6px 0 0; text-wrap: balance; }
h1 .amp { color: var(--accent); }
h2 { font-family: var(--display); font-weight: 400; font-size: calc(var(--display-size) * 0.55); letter-spacing: 1px; margin: 0; line-height: 1; text-wrap: balance; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none;
  font-family: var(--ui); font-size: var(--ui-size); letter-spacing: 1px; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); }
.banner p { margin: 0; line-height: 1.5; }
.banner strong { font-weight: 700; }

.card { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card p { margin: 0; color: var(--muted); line-height: 1.55; }
.card .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 600; font-size: 15px; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats dt { letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
.stats dd { margin: 0; }

.daily { border-color: var(--accent); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 16px 24px; }
.daily .info { flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.daily .grid-mini { flex: none; display: grid; gap: 2px; padding: 4px; background: var(--line); border-radius: 3px; }
.daily .grid-mini i { display: block; width: 9px; height: 9px; border-radius: 1px; }
.daily .row { margin: 0; }

.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.game-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.fan { position: relative; flex: none; height: 84px; }
.fan > div { position: absolute; top: 0; }
.tok-row { display: flex; gap: 4px; flex: none; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 24px; }
.bank { flex: 0 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bank .num { font-family: var(--display); font-size: calc(var(--display-size) * 0.5); line-height: 1; letter-spacing: 1px; }
.bank .num small { font-family: var(--body); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
.bank .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bank .bar i { display: block; height: 100%; background: var(--accent); }
.bank p { margin: 0; font-size: 12px; color: var(--muted); }
.side-sec { display: flex; flex-direction: column; gap: 12px; }
.side-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.side-head p { margin: 0; color: var(--muted); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.card.soon { opacity: 0.55; }
.soon-tag { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; align-self: flex-start; }
.tile2048 { width: 52px; height: 52px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 22px; background: var(--accent); color: var(--accent-text); }
.shelf-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.shelf-head p { margin: 0; color: var(--muted); font-size: 12px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px; }
.tile {
  text-align: left; font: inherit; color: var(--text); cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 12px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.tile:hover:not([aria-disabled="true"]) { border-color: var(--muted); }
.tile.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tile[aria-disabled="true"] { cursor: default; }
.tile .pair { display: flex; gap: 6px; height: 95px; }
.tile.locked .pair { opacity: 0.38; filter: grayscale(0.7); }
.tile .name { font-family: var(--ui); font-size: calc(var(--ui-size) * 0.95); letter-spacing: 1px; line-height: 1.1; }
.tile .tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tile.on .tag { color: var(--accent); }
.tile .new { color: var(--warn); }
.routes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.routes li { font-size: 11px; line-height: 1.4; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.routes .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.routes .bar i { display: block; height: 100%; background: var(--accent); }
.routes .or { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }

@media (max-width: 599px) {
  .app { gap: 16px; padding-block: 12px 48px; }
  h1 { font-size: calc(var(--display-size) * 0.95); }
  .card { padding: 14px; }
  .shelf { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
  .tile { padding: 10px; }
}
</style>

<main class="app">
  <header class="head">
    <div>
      <p class="kicker">Card games · puzzles · ten decks</p>
      <h1>The Devil <span class="amp">&amp;</span> The Cosmonaut</h1>
    </div>
    <div class="bank" id="bank" aria-label="Points"></div>
  </header>

  <section class="banner" id="banner" hidden aria-live="polite"></section>

  <section class="side-sec" aria-labelledby="devil-title">
    <div class="side-head"><h2 id="devil-title">The Devil</h2><p>Card games</p></div>
    <div class="games" id="devil-games"></div>
  </section>

  <section class="side-sec" aria-labelledby="cosmo-title">
    <div class="side-head"><h2 id="cosmo-title">The Cosmonaut</h2><p>Puzzles</p></div>
    <section class="card daily" id="daily" aria-label="Daily mission"></section>
    <div class="games" id="cosmo-games"></div>
  </section>

  <section aria-labelledby="shelf-title" style="display:flex;flex-direction:column;gap:12px">
    <div class="shelf-head">
      <h2 id="shelf-title">Decks</h2>
      <p id="shelf-sub"></p>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>
</main>

<script src="engine.js"></script>
<script src="app.js"></script>
<script>document.write('<script src="art-' + App.getDeck() + '.js"><\/script>');</script>
<script src="levels.js"></script>
<script>
(function () {
  'use strict';
  var CE = window.CardEngine, App = window.App, PACK = window.COSMO_LEVELS;
  var TIER_POINTS = { 'launch': 10, 'orbit': 20, 'deep-space': 35, 'binary-stars': 50, 'event-horizon': 75 };
  var LEVELS = [];
  PACK.tiers.forEach(function (t) { t.levels.forEach(function (l) { LEVELS.push({ tier: t.id, tierName: t.name, n: l.n, k: l.k, r: l.r }); }); });
  var deck = App.getDeck();
  var fresh = App.takeFresh();
  function $(id) { return document.getElementById(id); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function renderBanner() {
    var b = $('banner');
    if (!fresh.length) { b.hidden = true; return; }
    b.innerHTML = '<p><strong>New deck' + (fresh.length > 1 ? 's' : '') + ' unlocked: ' + App.listText(App.deckNames(fresh)) + '.</strong> Tap ' + (fresh.length > 1 ? 'one' : 'it') + ' on the shelf to equip.</p>' +
      '<button type="button" class="btn" id="banner-x">Got it</button>';
    b.hidden = false;
    $('banner-x').addEventListener('click', function () { fresh = []; render(); });
  }

  function renderDaily() {
    var key = App.today(), pick = App.dailyPick(key), L = LEVELS[pick.num - 1];
    var t = App.transformLevel({ n: L.n, r: L.r, s: [] }, pick.turn);
    var colours = CE.regionColours(deck, L.n), cells = '';
    for (var i = 0; i < L.n * L.n; i++) cells += '<i style="background:' + colours[parseInt(t.r.charAt(i), 36)] + '"></i>';
    var done = App.dailyResult(key), streak = App.currentStreak(), best = App.dailyState().bestStreak;
    var word = L.k === 1 ? 'King' : 'Queens';
    var status = done
      ? 'Cleared with ' + done.lives + ' of 3 lives. A new mission lands at midnight.'
      : 'Worth ' + TIER_POINTS[L.tier] + '+ points. Clear it today to ' + (streak ? 'extend your streak' : 'start a streak') + '.';
    $('daily').innerHTML =
      '<div class="grid-mini" aria-hidden="true" style="grid-template-columns:repeat(' + L.n + ',9px)">' + cells + '</div>' +
      '<div class="info">' +
        '<p class="kicker">Daily mission · ' + App.prettyDate(key) + '</p>' +
        '<h2>' + L.n + '×' + L.n + ' · one ' + word + ' per line</h2>' +
        '<p>' + status + '</p>' +
        '<dl class="stats"><div><dt>Streak</dt><dd><b>' + plural(streak, 'day', 'days') + '</b></dd></div><div><dt>Best streak</dt><dd><b>' + plural(best, 'day', 'days') + '</b></dd></div></dl>' +
      '</div>' +
      '<div class="row"><a class="btn' + (done ? '' : ' primary') + '" href="cosmo.html#daily">' + (done ? 'Play again' : 'Play today\'s mission') + '</a></div>';
  }

  function fan(cards) {
    var out = '';
    cards.forEach(function (c, k) {
      out += '<div style="left:' + (k * 22) + 'px;transform:rotate(' + ((k - 1) * 7) + 'deg);transform-origin:50% 100%">' + CE.renderCard(c, deck, { width: 66 }) + '</div>';
    });
    return '<div class="fan" style="width:112px;height:96px" aria-hidden="true">' + out + '</div>';
  }
  function statList(items) {
    return '<dl class="stats">' + items.map(function (it) { return '<div><dt>' + it[0] + '</dt><dd><b>' + it[1] + '</b></dd></div>'; }).join('') + '</dl>';
  }
  function liveGame(key, field) { var g = App.load(key); return !!(g && g.S && !g.S.over && (!field || g.S[field])); }
  function st(key) { return App.load(key) || { played: 0, wins: 0 }; }

  // Every game on the home screen. "soon" games show as coming soon until their page exists.
  var GAMES = [
    { id: 'grip', side: 'devil', href: 'grip.html', kicker: 'Solitaire', title: "Devil's Grip",
      desc: 'Two packs, aces out. Build 2-5-8-J, 3-6-9-Q and 4-7-10-K up the rows and leave as few cards over as you can.',
      art: function () { return fan([{ rank: 'J', suit: 'S' }, { rank: 'Q', suit: 'H' }, { rank: 'K', suit: 'D' }]); },
      stats: function () { var g = App.gripStats(); return [['Games', g.played], ['Perfect grips', g.wins], ['Best', g.best === null ? '—' : g.best + ' left']]; },
      button: function () { return liveGame('devils-grip:game:v1', 'grid') ? 'Resume game' : 'Deal'; } },
    { id: 'klondike', side: 'devil', href: 'klondike.html', soon: true, kicker: 'Solitaire', title: 'Klondike',
      desc: 'The classic. Build down in alternating colours, up by suit to the foundations. Draw one or three, with winnable deals on request.',
      art: function () { return fan([{ rank: '7', suit: 'H' }, { rank: '6', suit: 'S' }, { rank: '5', suit: 'D' }]); },
      stats: function () { var k = st('klondike:stats:v1'); return [['Games', k.played], ['Wins', k.wins], ['Streak', k.streak || 0]]; },
      button: function () { return liveGame('klondike:game:v1') ? 'Resume game' : 'Deal'; } },
    { id: 'pyramid', side: 'devil', href: 'pyramid.html', kicker: 'Solitaire', title: 'Pyramid',
      desc: 'Clear the pyramid in pairs that add up to 13. Kings go alone.',
      art: function () { return fan([{ rank: '6', suit: 'C' }, { rank: '7', suit: 'H' }, { rank: 'K', suit: 'S' }]); },
      stats: function () { var k = st('pyramid:stats:v1'); return [['Games', k.played], ['Cleared', k.wins], ['Streak', k.streak || 0]]; },
      button: function () { return liveGame('pyramid:game:v1') ? 'Resume game' : 'Deal'; } },
    { id: 'hearts', side: 'devil', href: 'hearts.html', soon: true, kicker: 'Trick-taking', title: 'Hearts',
      desc: 'Three opponents, avoid every heart and the Queen of Spades, or take them all and shoot the moon. First to 100 loses.',
      art: function () { return fan([{ rank: 'A', suit: 'H' }, { rank: 'Q', suit: 'S' }, { rank: '10', suit: 'H' }]); },
      stats: function () { var k = st('hearts:stats:v1'); return [['Games', k.played], ['Wins', k.wins], ['Moons', k.moons || 0]]; },
      button: function () { return liveGame('hearts:game:v1') ? 'Resume game' : 'Play'; } },
    { id: 'spades', side: 'devil', href: 'spades.html', soon: true, kicker: 'Trick-taking', title: 'Spades',
      desc: 'You and a partner against two opponents. Bid your tricks, beware the bags, first to 500.',
      art: function () { return fan([{ rank: 'A', suit: 'S' }, { rank: 'K', suit: 'S' }, { rank: '2', suit: 'S' }]); },
      stats: function () { var k = st('spades:stats:v1'); return [['Games', k.played], ['Wins', k.wins], ['Nils made', k.nils || 0]]; },
      button: function () { return liveGame('spades:game:v1') ? 'Resume game' : 'Play'; } },
    { id: 'cosmo', side: 'cosmo', href: 'cosmo.html', kicker: 'Star battle', title: 'Cosmonaut Sudoku',
      desc: 'One token in every row, column and region, never touching. Three lives a level, ' + LEVELS.length + ' levels from 5×5 to 12×12.',
      art: function () { return '<div class="tok-row" aria-hidden="true">' + CE.renderToken(deck, 'K', 'H', 40) + CE.renderToken(deck, 'Q', 'S', 40) + '</div>'; },
      stats: function () {
        var prog = App.load('cosmo:progress:v1') || {}, best = prog.best || {}, cleared = App.cosmoCleared(), next = 1;
        while (next < LEVELS.length && best[next]) next++;
        var L = LEVELS[next - 1];
        return [['Cleared', cleared + ' / ' + LEVELS.length], ['Score', prog.score || 0], ['Next', cleared >= LEVELS.length ? 'All clear' : 'Level ' + next + ' · ' + L.n + '×' + L.n]];
      },
      button: function () { var c = App.cosmoCleared(); return c >= LEVELS.length ? 'Levels' : c ? 'Continue' : 'Launch'; } },
    { id: 'g2048', side: 'cosmo', href: '2048.html', soon: true, kicker: 'Sliding tiles', title: '2048',
      desc: "Slide and merge matching tiles. Reach 2048 and the tile turns into your deck's King.",
      art: function () { return '<div class="tile2048" aria-hidden="true">2048</div>'; },
      stats: function () { var k = st('2048:stats:v1'); return [['Games', k.played], ['Best', k.best || 0], ['Top tile', k.top || '—']]; },
      button: function () { return liveGame('2048:game:v1') ? 'Resume game' : 'Play'; } }
  ];

  function gameCard(g) {
    return '<article class="card' + (g.soon ? ' soon' : '') + '">' +
      '<div class="game-head"><div><p class="kicker">' + g.kicker + '</p><h2>' + g.title + '</h2></div>' + g.art() + '</div>' +
      '<p>' + g.desc + '</p>' +
      (g.soon ? '' : statList(g.stats())) +
      '<div class="row">' + (g.soon ? '<span class="soon-tag">Coming soon</span>' : '<a class="btn primary" href="' + g.href + '">' + g.button() + '</a>') + '</div></article>';
  }
  function renderGames() {
    $('devil-games').innerHTML = GAMES.filter(function (g) { return g.side === 'devil'; }).map(gameCard).join('');
    $('cosmo-games').innerHTML = GAMES.filter(function (g) { return g.side === 'cosmo'; }).map(gameCard).join('');
  }

  function renderBank() {
    var t = App.points(), nd = App.nextDeck();
    $('bank').innerHTML = '<div class="num">' + t.toLocaleString() + '<small>points</small></div>' +
      (nd ? '<div class="bar"><i style="width:' + Math.round(nd.pct * 100) + '%"></i></div><p>' + (nd.need - t).toLocaleString() + ' more to unlock ' + nd.name + '</p>'
          : '<p>Every deck unlocked.</p>');
  }

  function renderShelf() {
    var list = App.decks(), open = list.filter(function (d) { return d.unlocked; }).length;
    $('shelf-sub').textContent = open + ' of ' + list.length + ' unlocked · every game earns points toward the next deck';
    $('shelf').innerHTML = list.map(function (d) {
      var on = d.id === deck, isNew = fresh.indexOf(d.id) >= 0;
      var pair = d.unlocked
        ? CE.renderCard({ rank: 'K', suit: 'H' }, d.id, { width: 66 }) + CE.renderCard({ rank: 'Q', suit: 'S' }, d.id, { width: 66 })
        : CE.renderBack(d.id, { width: 66 });
      var tag = on ? 'Equipped' : d.unlocked ? (isNew ? '<span class="new">New · tap to equip</span>' : 'Tap to equip') : 'Locked';
      var routes = d.unlocked ? '' : '<ul class="routes"><li><span>Unlocks at <b>' + d.need.toLocaleString() + ' points</b></span><span class="bar"><i style="width:' + Math.round(d.pct * 100) + '%"></i></span></li></ul>';
      return '<div class="tile' + (on ? ' on' : '') + (d.unlocked ? '' : ' locked') + '" role="button" tabindex="0" data-id="' + d.id + '"' +
        (d.unlocked ? ' aria-pressed="' + on + '"' : ' aria-disabled="true"') + ' aria-label="' + d.name + (d.unlocked ? (on ? ', equipped' : ', tap to equip') : ', locked') + '">' +
        '<div class="pair" aria-hidden="true">' + pair + '</div>' +
        '<div><div class="name">' + d.name + '</div><div class="tag">' + (d.starter && !on ? 'Starter · ' : '') + tag + '</div></div>' + routes + '</div>';
    }).join('');
  }

  // Art for other unlocked decks loads after the page is up, so the shelf previews sharpen in place.
  function loadShelfArt() {
    App.decks().forEach(function (d) { if (d.unlocked && !App.artLoaded(d.id)) App.ensureArt(d.id, renderShelf); });
  }

  function render() {
    App.applyTheme(deck);
    renderBank(); renderBanner(); renderDaily(); renderGames(); renderShelf();
  }

  function equip(el) {
    var id = el && el.getAttribute('data-id');
    if (!id || el.getAttribute('aria-disabled') === 'true' || id === deck) return;
    if (App.setDeck(id)) {
      deck = id; render();
      App.ensureArt(id, render);
      var t = document.querySelector('.tile[data-id="' + id + '"]'); if (t) t.focus();
    }
  }
  $('shelf').addEventListener('click', function (e) { equip(e.target.closest('.tile')); });
  $('shelf').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); equip(e.target.closest('.tile')); }
  });
  render();
  setTimeout(loadShelfArt, 400);
})();
</script>
